{% extends "base.html" %}{% block title %}{{ t('nav_admin') }}{% endblock %}{% block content %}
<section class="login-card"><div class="success-icon">⌁</div><p class="eyebrow">{{ t('restricted_area') }}</p><h1>{{ t('admin_login_heading') }} <span>{{ t('nav_admin') }}.</span></h1><p class="muted">{{ t('login_copy') }}</p>
<form method="post" class="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>{{ t('username') }}<input name="username" required autocomplete="username" placeholder="{{ t('username_placeholder') }}"></label><label>{{ t('password') }}<input name="password" type="password" required autocomplete="current-password" placeholder="{{ t('password') }}"></label><button class="button" type="submit">{{ t('sign_in') }} ↗</button></form><p class="login-hint">{{ t('demo_credentials') }}</p></section>{% endblock %}
