{% extends "base.html" %}{% block title %}{{ t('register_title') }}{% endblock %}{% block content %}
<section class="auth-card registration-card"><div class="auth-mark" aria-hidden="true">✦</div><p class="eyebrow">{{ t('student_register')|upper }}</p><h1>{{ t('register_heading') }}</h1><p class="muted">{{ t('register_copy') }}</p>
<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>{{ t('full_name') }}<input name="full_name" required maxlength="120" autocomplete="name" placeholder="Aarav Sharma"></label>
<label>{{ t('college_email') }}<input name="college_email" type="email" required maxlength="254" autocomplete="email" placeholder="you@college.edu"></label>
<label>{{ t('enrollment_number') }}<input name="enrollment_number" required minlength="3" maxlength="32" autocomplete="off" placeholder="e.g. CSE2024001"></label>
<div class="auth-form-grid"><label>{{ t('department_year') }}<input name="department" required maxlength="100" placeholder="{{ t('department_placeholder') }}"></label><label>{{ t('academic_year') }}<input name="academic_year" required maxlength="40" placeholder="{{ t('academic_year_placeholder') }}"></label></div>
<label class="password-field">{{ t('password') }}<span class="password-input"><input id="registerPassword" name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><button type="button" class="password-toggle" data-password-target="registerPassword" aria-label="{{ t('show_password') }}">◉</button></span><small>{{ t('password_hint') }}</small></label>
<label class="password-field">{{ t('confirm_password') }}<span class="password-input"><input id="confirmPassword" name="confirm_password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="{{ t('show_password') }}">◉</button></span></label>
<button class="button auth-submit" type="submit">{{ t('create_account') }} ↗</button></form>
<p class="auth-switch">{{ t('already_registered') }} <a href="{{ url_for('student_login') }}">{{ t('login_here') }}</a></p></section>{% endblock %}
